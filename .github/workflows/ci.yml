name: CI

# Frontend and backend tests on every push to main and on every pull request.
# Also called by deploy.yml, so nothing is deployed without green tests.
# No secrets are used here, so pull requests from forks are safe.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend – install, test, build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      # deploy.sh runs on the VPS; its cases (first deployment, cleanup, failures) are tested with a stub docker.
      - name: Deploy script test
        run: bash deploy/test-deploy-script.sh

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      # Tests that need real arcdps logs skip themselves (logs are not in the repository).
      - name: Backend – build and test
        working-directory: backend
        run: dotnet test --solution Breakbar.slnx -c Release

# breakbar-logs on the VPS (docs/PLAN.md 6b, deploy/README.md).
#   cd /srv/breakbar-logs && docker compose -f deploy/docker-compose.yml up -d
# Caddy on the host terminates TLS for logs.breakbar.cc and reports.breakbar.cc and proxies to 127.0.0.1:4100.
name: breakbar-logs

services:
  app:
    # Built and published by GitHub Actions; "build" is the fallback for building on the VPS itself
    # (docker compose ... up -d --build). Building there costs several minutes of CPU next to voidlog.
    image: ghcr.io/breakbarcc/breakbar-log-parser:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Loopback only: just the host (Caddy) can reach the app. Required for ForwardedHeaders__TrustAllProxies.
    ports:
      - "127.0.0.1:4100:8080"
    volumes:
      # SQLite database, uploads, reports, EI assets. Must be writable by UID 1654 (the image's "app" user).
      - ${BREAKBAR_DATA:-/srv/breakbar-logs/data}:/app/data
    env_file:
      # Secrets such as ServiceClients__ApiKeys__voidlog, see .env.example
      - path: .env
        required: false
    # 2 vCPU / 4 GB VPS shared with voidlog (docs/PLAN.md 1b): the parser may use both cores, but voidlog
    # wins under contention (lower cpu_shares). .NET sizes its heap from the memory limit (75 %).
    mem_limit: 2800m
    cpus: 2.0
    cpu_shares: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

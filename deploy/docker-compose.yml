# breakbar-logs on the VPS (docs/PLAN.md 6b, deploy/README.md).
# Normally started by deploy/deploy.sh (called from GitHub Actions, see .github/workflows/deploy.yml);
# by hand: IMAGE_TAG=<commit sha> docker compose -f deploy/docker-compose.yml up -d
# Caddy on the host terminates TLS for logs.breakbar.cc and reports.breakbar.cc and proxies to 127.0.0.1:4100.
name: breakbar-logs

services:
  app:
    # The image is built in GitHub Actions and loaded onto the VPS over SSH (no registry, no build on the VPS).
    # "pull_policy: never": a missing image must fail loudly instead of being searched on Docker Hub.
    image: breakbar-logs:${IMAGE_TAG:-latest}
    pull_policy: never
    # Only for building locally (docker compose ... build); the VPS has no source code.
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Loopback only: just the host (Caddy) can reach the app. Required for ForwardedHeaders__TrustAllProxies.
    ports:
      - "127.0.0.1:4100:8080"
    volumes:
      # SQLite database, uploads, reports, EI assets. Default: the folder "data" next to "deploy" (relative to this file).
      # Must be writable by UID 1654 (the image's "app" user).
      - ${BREAKBAR_DATA:-../data}:/app/data
    env_file:
      # Secrets such as ServiceClients__ApiKeys__voidlog, see .env.example
      - path: .env
        required: false
    # 2 vCPU / 4 GB VPS shared with voidlog (docs/PLAN.md 1b): the parser may use both cores, but voidlog
    # wins under contention (lower cpu_shares). .NET sizes its heap from the memory limit (75 %).
    mem_limit: 2800m
    cpus: 2.0
    cpu_shares: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
